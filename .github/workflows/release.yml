name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: git archive --format=tar.gz -o loopi.tar.gz "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" loopi.tar.gz --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
